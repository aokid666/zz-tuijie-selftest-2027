name: Audit and build original sources
on:
  push:
    paths: ['pdf/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: source-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF==1.26.6 rapidocr-onnxruntime==1.4.4
      - run: python tools/build.py
      - name: Preserve audited text and manifests
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then git commit -m 'Audit original source text and page coordinates'; git fetch origin main; git merge --no-edit origin/main; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit
          path: data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
